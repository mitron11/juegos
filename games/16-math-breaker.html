<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica | Resolver Ecuaciones</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* La web real que verán los profesores */
        #original-web {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 2; /* Siempre por encima */
        }

        /* El contenedor del juego oculto */
        #secret-game {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1; /* Debajo de la web original */
            color: white;
            font-family: Arial, sans-serif;
        }

        /* Estilo para el aviso de "Modo Incógnito" */
        #alert-box {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            color: rgba(255,255,255,0.2);
            padding: 5px;
            font-size: 10px;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <iframe src="https://calcsolver.net/" id="original-web"></iframe>

    <div id="secret-game">
        <h1 style="color: #e91e63;">MODO JUEGO ACTIVADO</h1>
        <p>Pulsa <b>Alt + Q</b> para volver a la calculadora rápidamente.</p>
        
        <iframe src="13-tetris.html" style="width: 500px; height: 700px; border: 4px solid #e91e63;"></iframe>
    </div>

    <div id="alert-box">V3.1 Secure</div>

    <script>
        const webOriginal = document.getElementById('original-web');
        const juegoSecreto = document.getElementById('secret-game');

        // LÓGICA DE LA PUERTA TRASERA
        document.addEventListener('keydown', function(e) {
            // ALT + J para JUGAR (Oculta la web y muestra el juego)
            if (e.altKey && e.key.toLowerCase() === 'j') {
                webOriginal.style.display = 'none';
                console.log("Capa de camuflaje desactivada");
            }

            // ALT + Q para QUITAR (Oculta el juego y muestra la web corriendo)
            if (e.altKey && e.key.toLowerCase() === 'q') {
                webOriginal.style.display = 'block';
                console.log("Capa de camuflaje activada");
            }
        });
    </script>
</body>
</html>
